<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - GlyphForge</title>
    <link rel="stylesheet" href="frame.css">
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23ff2d6f'/%3E%3Ctext x='50' y='58' font-size='48' text-anchor='middle' fill='white' font-family='Arial'%3EG%3C/text%3E%3C/svg%3E">
    <style>
        /* Popup styling */
        #popup {
            display: none;
            position: fixed;
            top: 100%;
            left: 100%;
            transform: translate(-50%, -50%);
            background: #48989f;
            color: #471212;
            padding: 30px 50px;
            border-radius: 15px;
            box-shadow: 0 0 20px #02383e89;
            z-index: 1000;
            font-weight: bold;
            text-align: center;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <div class="frame-box">
        <h1>Contact Us</h1>
        <p>We’d love to hear from you! Contact GlyphForge using the form below.</p>

        <form id="contactForm">
            <input type="text" placeholder="Your Name" required>
            <input type="email" placeholder="Your Email" required>
            <textarea rows="5" placeholder="Your Message..." required></textarea>

            <button type="submit">Send Message</button>
        </form>

        <p style="margin-top: 10px;">Or email us at:<br>
            <strong>support.glyphforge@gmail.com</strong>
        </p>
    </div>

    <!-- Popup -->
    <div id="popup">Message Sent Successfully!</div>

    <script>


        // Handle contact form submission
        const form = document.getElementById('contactForm');
        form.addEventListener('submit', function (e) {
            e.preventDefault(); // prevent default form submission

            const name = this.querySelector('input[type="text"]').value;
            const email = this.querySelector('input[type="email"]').value;
            const message = this.querySelector('textarea').value;

            if (!name || !email || !message) {
                alert("Please fill all fields!");
                return;
            }

            // Show popup
            const popup = document.getElementById('popup');
            popup.innerText = `✅ Thank you ${name}! Your message has been sent successfully.`;
            popup.style.display = 'block';
            setTimeout(() => popup.style.display = 'none', 3000);

            // Clear form
            this.reset();
        });
    </script>



</body>

</html>
